function actionRows(label,count,prefix){return `<button class="chapter" data-${prefix}-random><span><strong>随机练习 20 题</strong><small>从${esc(label)}随机抽取 · ${modeLabel()}模式</small></span><i class="arrow"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,48V96a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h28.69L182.06,73.37a79.56,79.56,0,0,0-56.13-23.43h-.45A79.52,79.52,0,0,0,69.59,72.71,8,8,0,0,1,58.41,61.27a96,96,0,0,1,135,.79L208,76.69V48a8,8,0,0,1,16,0ZM186.41,183.29a80,80,0,0,1-112.47-.66L59.31,168H88a8,8,0,0,0,0-16H40a8,8,0,0,0-8,8v48a8,8,0,0,0,16,0V179.31l14.63,14.63A95.43,95.43,0,0,0,130,222.06h.53a95.36,95.36,0,0,0,67.07-27.33,8,8,0,0,0-11.18-11.44Z"/></svg></i></button><button class="chapter" data-${prefix}-all><span><strong>练习全部题目</strong><small>${count} 题 · ${modeLabel()}模式</small></span><i class="arrow">›</i></button>`}

function renderSourcePractice(){const children=pathChildren(libraryPath),items=pathQuestions(libraryPath),trainableItems=trainable(items),crumb=libraryPath.length?libraryPath.join(' · '):'全部来源';$('#practiceSubjects').innerHTML=libraryPath.length?`<button class="chip" data-path-back>‹ 返回</button><button class="chip active">${esc(crumb)}</button>`:'<button class="chip active">全部来源</button>';const actions=libraryPath.length?actionRows(crumb,trainableItems.length,'path'):'';$('#practiceList').innerHTML=actions+children.map(([name,n])=>`<button class="chapter" data-path-child="${esc(name)}"><span><strong>${esc(name)}</strong><small>${n} 题</small></span><i class="arrow">›</i></button>`).join('')||(libraryPath.length?'':'<div class="empty">暂无题库，请先从设置导入数据。</div>');$('[data-path-back]')?.addEventListener('click',()=>{libraryPath.pop();renderPractice()});$$('[data-path-child]').forEach(b=>b.onclick=()=>{libraryPath.push(b.dataset.pathChild);renderPractice()});$('[data-path-random]')?.addEventListener('click',()=>startPathSession(true));$('[data-path-all]')?.addEventListener('click',()=>startPathSession(false))}
function renderPractice(){$('#browseBySubject').classList.toggle('active',browseMode==='subject');$('#browseBySource').classList.toggle('active',browseMode==='source');browseMode==='subject'?renderSubjectPractice():renderSourcePractice();updateModeSwitch()}
function startPathSession(random){const rows=trainable(pathQuestions(libraryPath));if(!rows.length)return toast('当前目录没有可练习题目');session=random?[...rows].sort(()=>Math.random()-.5).slice(0,20):rows;sessionScope={type:'source',path:[...libraryPath]};sessionTitle=`${libraryPath.join(' · ')} · ${random?'随机 20 题':'全部练习'}`;startSession(false)}
function startChapter(chapter){const sub=SUBJECTS.find(s=>s.id===selectedSubject);if(!sub)return toast('请先导入题库');const rows=subjectQuestions().filter(q=>q.chapter===chapter),available=trainable(rows),r=validResume();if(resumeMatchesChapter(r,sub.id,chapter,rows))return resumeSession();if(!available.length){openSlashedChapter(sub.id,chapter);return toast('本章题目均已斩，可在列表中恢复')}session=available;sessionScope={type:'chapter',subjectId:sub.id,chapter,key:chapterKey(sub.id,chapter)};sessionTitle=`${sub.name} · ${chapter}`;startSession(false)}

function emptyBank(){return {format:'medical-question-bank',version:1,subjects:[],questions:[]}}
function validateBank(data){
  if(!data||data.format!=='medical-question-bank'||data.version!==1||!Array.isArray(data.subjects)||!Array.isArray(data.questions))throw Error('需要 medical-question-bank 版本 1 的 JSON 文件');

  const validSubjectId=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(x)&&!blockedId(x);
  const validQuestionId=x=>typeof x==='string'&&x.length>0&&x.length<=200&&!/[\u0000-\u001F\u007F]/.test(x)&&!blockedId(x);
  const str=(x,max)=>typeof x==='string'&&x.trim().length>0&&x.length<=max;

  imported.questions.forEach(q=>{if(!deleted.has(q.subjectId)&&!byId.has(q.id))byId.set(q.id,{...q,subject:subjectMap.get(q.subjectId)?.name||q.subject})});

function receiveData(text){
  const status=$('#bankStatus');
  try{
    if(text.length>DX.MAX_IMPORT_SIZE)throw Error('文件上限为 64 MB');
    const document=DX.parseEnvelope(text),full=document.exportType==='full_backup';
    status.textContent=`已识别：${exportLabels[document.exportType]}${document.legacy?`（Legacy ${document.legacyFormat}）`:''}`;
    if(full&&!confirm(`${document.legacy?'检测到 Legacy 完整备份。':'即将执行 Full Restore。'}\n\n将恢复并覆盖：题库、学习进度、收藏/错题/斩题标记和设置。\n不会自动生成恢复前备份；如需保留当前状态，请先取消并导出 Full Backup。\n\n继续恢复？`))return {cancelled:true,document};
    const result=DX.applyImport(document,exchangeSnapshot());

    }else if(full){persistExactQuestionBank(result.snapshot);state=normalizeState(result.snapshot.state);save()}
    else{state=normalizeState(result.snapshot.state);save()}
    renderAfterDataImport();status.textContent=importSummary(result);return result;
  }catch(e){status.textContent='未导入：'+e.message;return {error:e.message}}
}

  $('.settings-card').append(copyBox);applyHomeCopy();
  $('#saveHomeCopy').onclick=()=>{state.homeTitle=cleanHomeTitle($('#homeTitleInput').value);state.homeSlogan=cleanHomeSlogan($('#homeSloganInput').value);save();applyHomeCopy();toast('首页文案已保存')};
  $('#resetHomeCopy').onclick=()=>{state.homeTitle=DEFAULT_HOME_TITLE;state.homeSlogan=DEFAULT_HOME_SLOGAN;save();applyHomeCopy();toast('已恢复默认文案')};
  const box=document.createElement('div');box.className='settings-section';
  const icon=up=>`<svg class="data-transfer-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--surface2)"/><path d="M9.5 22.5v5.2c0 1.55 1.25 2.8 2.8 2.8h15.4c1.55 0 2.8-1.25 2.8-2.8v-5.2" stroke="var(--ink)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/><path d="${up?'M20 23.2V9.8M14.7 15.1 20 9.8l5.3 5.3':'M20 9.8v13.4M14.7 17.9 20 23.2l5.3-5.3'}" stroke="var(--primary)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
   box.innerHTML='<p class="settings-section-title">导入</p><div class="data-actions"><button class="data-action" id="importBank">'+icon(false)+'<span><strong>自动识别并导入</strong><small>支持正式 v1 题库、五类数据和 Legacy Backup</small></span></button></div><input hidden id="bankFile" type="file" accept=".json,application/json"><p class="settings-section-title" style="margin-top:18px">导出类型</p><div class="data-actions"><button class="data-action" data-export-type="question_bank">'+icon(true)+'<span><strong>Question Bank</strong><small>仅题库正文，不含个人状态</small></span></button><button class="data-action" data-export-type="progress">'+icon(true)+'<span><strong>Progress</strong><small>作答、历史、统计与断点</small></span></button><button class="data-action" data-export-type="markers">'+icon(true)+'<span><strong>Markers</strong><small>收藏、错题与斩题</small></span></button><button class="data-action" data-export-type="settings">'+icon(true)+'<span><strong>Settings</strong><small>外观和首页文案</small></span></button><button class="data-action" data-export-type="full_backup">'+icon(true)+'<span><strong>Full Backup</strong><small>分域完整备份，用于换机和灾难恢复</small></span></button></div><p class="data-note">正式 v1 题库必须包含完整四段解析及全部实际选项解析；Legacy Backup 继续兼容迁移。单个导入文件上限为 64 MB。</p><p class="bank-status" id="bankStatus" role="status"></p><div class="settings-section"><p class="settings-section-title">题库管理</p><div class="bank-manage-list" id="bankManageList"></div></div>';
  $('.settings-card').append(box);renderBankManager();
   $('#bankFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>DX.MAX_IMPORT_SIZE)throw Error('文件上限为 64 MB');receiveData(await f.text())}catch(err){$('#bankStatus').textContent='未导入：'+err.message}e.target.value=''};
  $('#importBank').onclick=()=>$('#bankFile').click();
  $$('[data-export-type]').forEach(button=>button.onclick=()=>exportDomain(button.dataset.exportType));
  const chevronRight='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9.5 6.3 5.7 5.7-5.7 5.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const chevronLeft='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 6.3-5.7 5.7 5.7 5.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const closeIcon='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  function normalizeIcons(){
    $$('.arrow').forEach(a=>{const t=a.textContent.trim();if(t==='›')a.innerHTML=chevronRight});
  }
  $('#exitQuiz').innerHTML=chevronLeft;
  $('#closeAnswerCard').innerHTML=chevronLeft;
  $('#closeSlashedSheet').innerHTML=chevronLeft;
  $('#closeSettings').innerHTML=closeIcon;
  normalizeIcons();
  new MutationObserver(normalizeIcons).observe($('main'),{childList:true,subtree:true});
}
initBankSettings();
renderHome();
</script>
</body>
</html>
